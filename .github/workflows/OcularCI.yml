name: Ocular Anomaly CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  ocular-notebook:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install System Dependencies (OpenCV + CMake)
        run: |
          sudo apt-get update
          sudo apt-get install -y libopencv-dev cmake ninja-build

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build C++ Module
        run: |
          mkdir -p build && cd build
          cmake -DPYTHON_EXECUTABLE=$(which python) \
                -Dpybind11_DIR=$(python -m pybind11 --cmakedir) \
                ..
          make -j$(nproc)

      - name: Execute Notebook Testing
        env:
          CI_RUN: "true"
        run: |
          jupyter nbconvert --to notebook --execute Ocular_Anomaly_Detection.ipynb --output output_verify.ipynb